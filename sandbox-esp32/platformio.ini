; PlatformIO Project Configuration — пісочниця для РЕАЛЬНОЇ плати ESP32.
; На відміну від модулів m0/m1 (Wokwi-емулятор) тут орієнтир на залізо:
; реальний upload + serial monitor. Версії пінуємо заради відтворюваності.

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

; --- Serial monitor ---
monitor_speed = 115200
; Розкодовує адреси у бектрейсах ESP32 у назви функцій/рядки коду.
monitor_filters = esp32_exception_decoder, time

; --- Upload ---
; Якщо автодетект порту не спрацював — розкоментуй і впиши свій COM-порт
; (дізнатись: `pio device list`).
; upload_port = COM3
; upload_speed = 921600

; --- Бібліотеки ---
; Швидкий шлях для OLED SSD1306 (128x64, I2C 0x3C). Adafruit BusIO
; підтягнеться автоматично як залежність. У M5 це заміниться власним драйвером.
lib_deps =
  adafruit/Adafruit SSD1306@^2.5.13
  adafruit/Adafruit GFX Library@^1.11.11
