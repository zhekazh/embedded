; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
; --- Дебаг через GDB-сервер симулятора Wokwi ---
; Перед F5: Command Palette -> "Wokwi: Start Simulator and Wait for Debugger".
debug_tool = custom
debug_server =
debug_port = localhost:3333
debug_init_break = tbreak setup
; Wokwi-gdbstub НЕ підтримує monitor/Rcmd (reset halt тощо), тож:
;  - вимикаємо завантаження прошивки через GDB (Wokwi вже має .elf із wokwi.toml);
;  - перевизначаємо reset-макроси PlatformIO порожніми й під'єднуємось напряму.
debug_load_mode = manual
debug_init_cmds =
  define pio_reset_halt_target
  end
  define pio_reset_run_target
  end
  define pio_restart_target
  end
  target remote $DEBUG_PORT
  $INIT_BREAK

